<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SYNORA 공개 QR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f3f8f6;
        --surface: rgba(255, 255, 255, 0.94);
        --line: rgba(27, 43, 38, 0.09);
        --text: #182723;
        --muted: #63716c;
        --mint: #8fe3d1;
        --mint-strong: #56c8b2;
        --shadow: 0 24px 60px rgba(93, 118, 111, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Noto Sans KR", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(143, 227, 209, 0.42), transparent 26%),
          linear-gradient(180deg, #f7fbfa 0%, #edf3f1 100%);
      }

      .card {
        width: min(100%, 540px);
        padding: 28px;
        border-radius: 32px;
        background: var(--surface);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        text-align: center;
      }

      .eyebrow {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0 10px;
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(32px, 7vw, 44px);
        line-height: 1;
        letter-spacing: -0.05em;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .qr-wrap {
        margin: 24px auto 20px;
        padding: 16px;
        width: min(100%, 360px);
        border-radius: 28px;
        background: white;
        border: 1px solid rgba(27, 43, 38, 0.06);
        box-shadow: inset 0 0 0 10px rgba(143, 227, 209, 0.08);
      }

      .qr-wrap img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 20px;
      }

      .button-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 22px;
      }

      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0 14px;
        border-radius: 18px;
        text-decoration: none;
        font-weight: 800;
        transition: transform 180ms ease, opacity 180ms ease;
      }

      a.button:hover {
        transform: translateY(-2px);
      }

      .primary {
        color: var(--text);
        background: linear-gradient(135deg, var(--mint), #def8f2);
      }

      .secondary {
        color: var(--text);
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--line);
      }

      .link-box {
        margin-top: 20px;
        padding: 14px 16px;
        border-radius: 18px;
        background: rgba(143, 227, 209, 0.12);
        border: 1px solid rgba(86, 200, 178, 0.14);
        word-break: break-all;
        font-size: 14px;
      }

      .link-box a {
        color: inherit;
      }

      @media (max-width: 520px) {
        .card {
          padding: 22px;
          border-radius: 24px;
        }

        .button-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Public QR</p>
      <h1>SYNORA</h1>
      <p>아래 QR을 스캔하면 공개 사이트로 바로 이동합니다.</p>

      <div class="qr-wrap">
        <img src="./synora-public-qr.png" alt="SYNORA 공개 사이트 QR 코드" />
      </div>

      <div class="button-row">
        <a class="button primary" href="./index.html">사이트 열기</a>
        <a class="button secondary" href="./synora-public-qr.png">QR 이미지 열기</a>
      </div>

      <div class="link-box">
        연결 주소:
        <a href="https://tjddmsdll.github.io/synora-flow-prototype/">
          https://tjddmsdll.github.io/synora-flow-prototype/
        </a>
      </div>
    </main>
  </body>
</html>
